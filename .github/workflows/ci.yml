name: CI

# Runs on every push and pull request against main so a broken commit shows
# up as a red X on GitHub before it reaches a student, instead of only being
# found by manual testing after deployment (which is how two real bugs
# slipped through earlier: see lib/decoder/command-verbs.ts and
# lib/citation/audit.ts). Vercel's own deploy already runs `next build`, but
# it does not run the test suite or lint as a separate, visible gate, and a
# failed Vercel deploy does not block main from accepting the commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # The npm version bundled with Node 20 on GitHub-hosted runners has a
      # known bug in its dependency resolver (Arborist) that crashes with
      # "Cannot read properties of null (reading 'edgesOut')" when resolving
      # vitest 4.x's optional peer dependencies. --legacy-peer-deps sidesteps
      # the buggy resolution path. Confirmed this installs cleanly.
      - run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Runs alongside the unit test job (not after it) so a broken e2e test
    # never delays the fast unit/lint feedback. A handful of real-browser
    # smoke checks: homepage loads correctly, the Find evidence flow works
    # end to end, every tool tab switches cleanly, and the manual citation
    # dialog opens. Added 26 August 2026 after a homepage change (value
    # proposition line, ad slot text fix) had to be checked by hand because
    # nothing automated covered actual browser rendering or click-through.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm install --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: End-to-end smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
